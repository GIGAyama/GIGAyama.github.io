name: 正本を全リポジトリへ自動配布

# standards/ 配下の正本が main にマージされたとき、または手動実行時に、
# 全配布先リポジトリ（tools/distribution.json）へ正本をコピーし、
# PR 作成と自動マージまでを一括実行する。
# これにより「配布のとりのこし」がゼロになる。

on:
  push:
    branches: [main]
    paths:
      - 'standards/**'
      - 'tools/distribute.mjs'
      - 'tools/distribution.json'
      - '.agents/rules/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# ⚠️ 走らせるのは一度に 1 本だけ。distribute.mjs は 42 本すべてに対し
#    固定名の枝 chore/sync-standards を `git push --force` し（:475）、
#    `gh pr merge --delete-branch` でマージする（:487-490）。名前が固定なので、
#    2 本が重なると **A が押した枝を B が上書きし、A の --delete-branch が
#    B の枝を消す**、という並びが成立する。
#    2026-08-30 に実際に重なった（run 26 が 12:34:59-12:40:46Z、
#    run 27 が 12:36:34-12:42:28Z。4 分あまり並走）。両方 success で済んだのは
#    順序の運でしかない。main へのマージが 2 分以内に続くのは常態なので、
#    いつ起きてもおかしくない。
#
# ⚠️ cancel-in-progress は false。true にすると、42 本の途中で配布が切られ、
#    **半分だけ新しい艦隊**が残る。どこまで配ったかは記録に出ないので、
#    次の配布まで誰も気づけない。sync-updates.yml が false なのも同じ理由。
#
# 保留は GitHub の仕様で 1 本だけになり、古い保留は取り消される。それでよい。
# distribute.mjs が配るのは checkout した作業ツリーの standards/ なので（:33, :36）、
# 最後に走る回がいちばん新しい main を配れば、取り消された中間の回のぶんも
# そこに含まれている。
concurrency:
  group: auto-distribute
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ⚠️ ここで止めないと、原因の見えない 403 が 42 本ぶん並ぶ。
      #
      # 下の各ステップは `secrets.PAT_TOKEN || secrets.GITHUB_TOKEN` と書いてある。
      # PAT_TOKEN が無いと GITHUB_TOKEN に落ちるが、**GITHUB_TOKEN はそのリポジトリ
      # にしか書けない**ので、他の 42 本への push は必ず 403 になる。
      # 2026-08-28 の実行がまさにこれで、
      #   remote: Permission to GIGAyama/word_basket.git denied to github-actions[bot].
      #   Failed : 42
      # と出た。42 本ぶんの 403 のどこにも「PAT_TOKEN が無い」とは書かれない。
      # 落ちる場所を先頭に移して、理由をそのまま出す。
      - name: PAT_TOKEN があるか先に確かめる
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error title=PAT_TOKEN が設定されていません::他のリポジトリへ push するには、リポジトリをまたげるトークンが要ります。GITHUB_TOKEN は自分のリポジトリにしか書けないため、このまま進めても 42 本すべてが 403 で失敗します。設定手順は docs/operations/pat-token.md にあります（必要な権限、Workflows 権限を忘れると 9 本だけ落ちる話、期限切れのときの見分け方）。"
            exit 1
          fi
          echo "PAT_TOKEN は設定されています"

      - name: Git 認証設定
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GIGA山"
          git config --global user.email "229759963+GIGAyama@users.noreply.github.com"
          gh auth setup-git

      - name: 全ターゲットリポジトリのクローン
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ../repos
          cd ..
          gh repo list GIGAyama --limit 100 --json name --jq '.[].name' | while read -r repo; do
            if [ "$repo" != "GIGAyama.github.io" ] && [ ! -d "$repo" ]; then
              echo "Cloning $repo..."
              gh repo clone "GIGAyama/$repo" "$repo" || true
            fi
          done
          cd GIGAyama.github.io

      - name: 正本の自動配布とPRマージを実行
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node tools/distribute.mjs
