# 公開中の画面を実ブラウザで巡回し、実際に出ていった通信を記録する。
#
# ⚠️ この流れが「呼ぶ側」である。standards/web/verify-no-external.mjs を
#    書いただけでは、誰も走らせない検査が 1 本増えるだけになる。
#    2026-08-28 に、verify を書いたのにワークフローが一度も呼んでいない
#    repo が 6 本あった。同じことをしない。
#
# 静的検査（giga-reviewer）との役割の違い:
#   静的検査 … コミット前に、書いてあるものを見る。速いが、実行時に
#              組み立てられる URL は原理的に見えない
#   ここ     … 週に 1 回、児童の端末が実際に読むものを見る。遅いが嘘がない
#
# ⚠️ 落ちても直しにいくのは人。自動で data/apps.json を書き替えない。
#    巡回が 1 回こけただけで全アプリの hosts が空になる、という壊し方を
#    できないようにしてある。
#
# ⚠️ --strict を付ける（2026-11-10 から）。それまでは**何が出ても緑**で、結果は
#    成果物の中にしか無かった。2026-11-08 の回は 14 本の食い違いを出して
#    success で終わっている。測っているのに誰も読まない検査になっていた。
#    落とすのは危ない側だけ:
#      ＋ 申請書に無いものを、子どもの端末が読んでいる
#      ・ 開けなかったアプリがある（トップに載せたのに開かない、を含む）
#    「－」（申請書にあるが開いた直後には読んでいない）では落とさない。入口を
#    開くだけの巡回では判断の材料にならず、落とすと毎週かならず赤くなる。
name: 実ブラウザで通信を記録する

on:
  schedule:
    - cron: '13 20 * * 0'      # UTC 日 20:13 ＝ 日本時間 月曜 朝 5:13
  workflow_dispatch:
    inputs:
      slug:
        description: '1 本だけ測る（例: typa）。空なら全部'
        required: false

permissions:
  contents: read
  issues: write              # 危ない側が出たとき、Issue にして人へ届ける

concurrency:
  group: verify-runtime
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 突き合わせの計算そのものを先に確かめる。
      # 計算が壊れていたら、巡回の結果は読む価値がない。
      - name: 検査そのもののテスト
        run: |
          node --test standards/web/verify-no-external.test.mjs
          node --test tools/verify-runtime.test.mjs

      # ポータルには package.json が無い（意図的）。
      # playwright はこの流れの中だけで使うので、--no-save で入れる。
      - name: playwright を入れる
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/pw" playwright
          npx --yes --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      # ⚠️ inputs を ${{ }} で run: に直に展開しない。GitHub が script injection
      #    として名指ししている型そのもので、展開はシェルが読む**前**に起きるので、
      #    空白やクォートを含む値を渡すだけでコマンドが割れる。
      #    書き込み権限のある人しか押せないので深刻度は低いが、直せる形なので直す。
      #    env: に入れて "$SLUG" として渡せば、何を入れても 1 つの引数のまま届く。
      #
      # ⚠️ 空でも --slug "" を渡してよい。verify-runtime.mjs の arg()（:64-68）は
      #    次の語が空なら fallback の null を返すので、--slug を付けないのと同じ
      #    「全部測る」に落ちる。分岐を書く必要が無い。
      #    （実測: --slug "" → null、--slug typa → "typa"、
      #      --slug "a; rm -rf /" → "a; rm -rf /" の 1 引数。シェルは通らない）
      #
      # ⚠️ set -o pipefail を置くのは、tee が終了コードを飲むため。
      #    無いと、--strict が 1 を返しても手順は緑のままになる。
      - name: 公開中の画面を巡回する
        env:
          NODE_PATH: ${{ env.NODE_PATH }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -o pipefail
          node tools/verify-runtime.mjs --strict --slug "$SLUG" \
            | tee "$RUNNER_TEMP/runtime.txt"

      # 成果物を落として開かなくても、実行のページでそのまま読めるようにする
      - name: 結果を実行のページに出す
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/runtime.txt" ]; then
            { echo '```'; cat "$RUNNER_TEMP/runtime.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-hosts
          path: ${{ runner.temp }}/runtime.txt
          if-no-files-found: ignore

      # ⚠️ 1 本だけ測った回（slug を渡した手動の回）は知らせない。その 1 本が緑でも
      #    ほかの赤は消えていないので、閉じてしまうと赤が見えなくなる。
      - name: 結果を Issue に知らせる
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.slug }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ job.status }}
        run: |
          node tools/report-issue.mjs --key verify-runtime \
            --title '🔴 公開中のアプリが、申請書に無いものを読んでいます（または開けません）' \
            --status "$STATUS" \
            --detail-file "$RUNNER_TEMP/runtime.txt" \
            --hint '＋ の行は data/apps.json の hosts に足すか、読まないようにアプリを直す。「測れなかった」は、そのアプリが開けるかを見る' \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
