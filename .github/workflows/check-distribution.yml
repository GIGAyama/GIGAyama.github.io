# 正本を直したのに配っていない配布先を見つける。
#
# 各リポジトリのずれ検知（standards/check-drift.mjs）は、そのリポジトリに
# push があったときにしか走らない。正本だけを直した日は配布先では何も起きず、
# 古いコピーが緑のまま残る。2026-08-22 にそれで10本の main を同時に赤くした。
# ここは逆向きに、正本を持つ側から配布先を覗きにいく。
#
# ⚠️ pull_request では走らせない。
#    配布先のずれ検知はポータルの main を見るので、正本が main に入るまで
#    配る PR は作れない。つまり「正本を直した PR」の時点では、配布先が
#    古いのが正しい状態になる。ここで赤くしても直しようがない。
#    main が赤いのは、配り終えるまでのやり残しの一覧として読む。
#
# ⚠️⚠️ **push では走らせない。配布が終わってから走らせる。**（2026-08-29）
#    以前は `push: branches: [main]` だった。ところが auto-distribute も
#    同じ push で起動するので、2 つが**同時に走って検査のほうが必ず先に終わる**。
#    配る前の艦隊を見るので、毎回かならず「配っていません」で赤くなっていた。
#
#      #104 のマージ … 検査 04:14→04:15 で失敗 ／ 配布 04:14→04:20 で成功
#      配布が終わったあとに同じ検査を手で走らせると
#        ✅ 配布先 42 本、2112 ファイルが正本と一致しています（exit 0）
#
#    2026-08-27 以降、マージのたびにこれで赤くなっていた（run 43〜67 のほぼ全部）。
#    **毎回赤い検査は、赤いことに意味が無くなる。**「誰も見ないログに出る警告は、
#    出ていないのと同じ」と同じ型で、しかもこちらは人を「無視してよい」に慣らす。
#
#    そこで workflow_run にして、配布が**終わってから**見る。
#    ⚠️ types: [completed] は成功でも失敗でも発火する。これは意図している。
#       配布が落ちた日ほど「何が配られていないか」を知りたいため。
#    ⚠️ auto-distribute は standards/** などに触った push でしか起動しない。
#       触っていない push では配るものが無いので、検査する必要も無い。
#       それ以外の理由で生まれたずれは、毎朝の schedule が拾う。
name: 配布のとりのこし

on:
  workflow_run:
    workflows: ['正本を全リポジトリへ自動配布']
    types: [completed]
  schedule:
    - cron: '47 22 * * *'      # UTC 22:47 ＝ 日本時間 朝 7:47
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-distribution
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 実測の最長 1.3 分。15 倍。同じく 42 本を見に行く
    # 既定は 360 分。固まったときに 6 時間ぶん食ってから落ちる
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 台帳と突き合わせの仕組み自体のテスト
        run: node --test tools/check-distribution.test.mjs
      - name: 配布先が正本と一致しているか
        env:
          # リポジトリ一覧を取るのに使う。無いと GitHub の側で強く絞られる。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/check-distribution.mjs
