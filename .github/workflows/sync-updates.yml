name: 更新情報を書き直す

# 各アプリのリポジトリを GitHub API で見に行き、公開日と最終更新日を data/apps.json に取り込んで、
# index.html の「更新情報」の節（updates:start 〜 updates:end）を組み直す。
# 変更があったときだけコミットする。

on:
  schedule:
    # ⚠️ GitHub の schedule は遅れる。2026-10〜11 の 35 回を測ると、書いた時刻から
    #    **1.8〜6.3 時間（中央 3.3 時間）**遅れて始まっていた。「朝 6:17」と書いて
    #    実際に走っていたのは 8 時すぎ〜12 時半。先生が朝に開く時刻に間に合わない。
    #    遅れを自分では縮められないので、遅れたあとでも朝に間に合う時刻に置く。
    # ⚠️ 日本時間の 0 時より前に置かないこと。日付は日本時間で切るので
    #    （tools/lib/dates.mjs）、前の日のうちに走ると「きのう」の日付で刻まれる。
    - cron: '17 16 * * *'      # UTC 16:17 ＝ 日本時間 1:17（遅れこみで 3 時〜7 時半ごろ）
  workflow_dispatch:            # 手で実行することもできる

permissions:
  contents: write
  issues: write              # 落ちたとき、Issue にして人へ届ける

concurrency:
  group: sync-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 実測の最長 2.4 分。8 倍。42 本ぶんの GitHub API を叩くので、向こうが遅い朝のぶんを見ておく
    # 既定は 360 分。固まったときに 6 時間ぶん食ってから落ちる
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 日付を取り直して index.html を組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync-updates.mjs --fetch

      # 各アプリのリポジトリにある docs/devlog/*.md を取ってきて、
      # giga-school.com/devlog/ に組み直す。published: true のものだけ出る。
      # ⚠️ 紹介ページより先に走らせる。紹介ページの末尾に出す
      #    「このアプリのつくり方（記録 N 本）」が data/devlog.json を読むため。
      #    順を入れ替えると、公開した当日だけ本数が 1 日ぶん古くなる。
      - name: 開発記録を組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-devlog.mjs

      # 各アプリのリポジトリにある docs/manual/manual.md を取ってきて、
      # giga-school.com/apps/<slug>/manual/ の使い方マニュアルとして書き出す。
      # ⚠️ 紹介ページより先に走らせる。紹介ページに出す「使い方マニュアル」の
      #    ボタンを出すかどうかが data/manuals.json を見て決まるため。
      #    順を入れ替えると、マニュアルを公開した当日だけ入口が出ない
      #    （開発記録を紹介ページより先に置いてあるのと同じ理由）。
      - name: 使い方マニュアルを組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-manuals.mjs

      # 各アプリのリポジトリにある note 記事を取ってきて、
      # giga-school.com/apps/<slug>/ の紹介ページとして書き出す。
      # 日付を先に取り直しておくのは、ページに出す「最終更新」に使うため。
      - name: アプリの紹介ページを組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-articles.mjs

      # sitemap と /apps/ の一覧は data/articles.json を見て組む。
      # その articles.json をいま書き替えたので、もう一度組み直す。
      # ここは GitHub を見に行かないので、すぐ終わる。
      - name: サイトマップと紹介ページの一覧を組み直す
        run: node tools/sync-updates.mjs

      # カードの data-slug は「最近開いた順」の記録に使う。カードの「開く」の
      # 行き先と食い違うと、押したのとは別のアプリを開いたことになり、
      # その記録が端末に残り続ける。気づきにくいので、ここで止める。
      - name: カードの data-slug が食い違っていないか
        run: node tools/check-cards.mjs

      # data/apps.json は 404.html の転送先の元になっている。
      # 取り込みで slug が壊れると、旧アドレスの受け皿が黙って効かなくなるので、
      # コミットする前にここで確かめる。
      - name: 旧アドレスの受け皿が壊れていないか
        run: node tools/check-404-redirect.mjs

      # 組み直したページが、自分のドメインの外から読み込んでいないか。
      # 2026-08-31、/apps/qalc/manual/ が画面写真 56 枚を
      # raw.githubusercontent.com から読んでいて、社内のフィルタリングが
      # 「カテゴリ：マルウェア」で giga-school.com ごと止めた。
      # 組み直すのは毎朝の自動処理なので、誰も目で見ない。ここで止める。
      - name: 外から読み込んでいないか（Zero-CDN）
        run: node tools/check-no-external.mjs

      # index.html は Service Worker の先読み一覧に入っている。書き替えたのに
      # 版を刻み直さないと、キャッシュ名が変わらないので、書き替えた入口が
      # 端末に届かない。しかもここは GITHUB_TOKEN で push するため、
      # GitHub の仕様でワークフローが起動せず、standards-ci の版ずれ検査を
      # 素通りする。赤くならないまま古い入口が残りつづける形になるので、
      # コミットする前にここで刻む。
      - name: SW の版を刻み直す
        run: |
          node tools/build-sw.mjs
          # 刻めたことをその場で確かめる。手順を入れ替えて刻む前にコミット
          # する形に戻ってしまったとき、ここで赤くなる。
          node tools/build-sw.mjs --check

      - name: 変わっていたらコミットする
        # ⚠️ ここに並べた道だけがコミットに入る。組み直したのに並べ忘れた
        #    ページは、毎朝つくり直されては毎朝捨てられる。リポジトリには
        #    古い数字が残り続け、しかも検査は組み直したあとの新しいページを
        #    見るので緑のままになる。**目でも検査でも気づけない**。
        #    上の各手順が書き出す先を、ひとつ残らずここに並べる。
        #      tools/sync-updates.mjs  data/apps.json / data/lastmod.json /
        #                              data/changelog.json / index.html /
        #                              sitemap.xml / feed.xml / apps/ / filtering/ / press/ /
        #                              data/search-index.json
        #      tools/build-devlog.mjs  data/devlog.json / devlog/
        #      tools/build-articles.mjs data/articles.json / apps/ /
        #                              data/article-images.json
        #      tools/build-manuals.mjs data/manuals.json / apps/<slug>/manual/ /
        #                              data/manual-images.json
        #      tools/build-sw.mjs      sw.js
        #
        # ⚠️ 2 つの台帳を外さないこと。
        #    data/lastmod.json … 毎朝捨てられると、翌朝すべてのページの lastmod が
        #      「今日」に揃う。2026-08-30 の時点で 90 URL 中 88 が同じ日付だった
        #      状態が、そのまま戻る。
        #    data/changelog.json … 各アプリが書いた更新ログ。捨てられると、
        #      トップの「更新したこと」が毎朝消えてはまた出る。
        #    どちらも組み直したあとを見る検査は緑のまま通るので、気づけない。
        run: |
          PATHS="data/apps.json data/lastmod.json data/changelog.json \
                 data/articles.json data/manuals.json \
                 data/devlog.json data/search-index.json \
                 data/article-images.json data/manual-images.json \
                 index.html sitemap.xml feed.xml sw.js apps/ devlog/ filtering/ press/"
          # git diff は追跡ずみのものしか見ない。新しく増えたページ（新しい
          # 紹介ページ、新しい分野の入口）は git status のほうで拾う。
          if git diff --quiet -- $PATHS && [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "変更なし。コミットしない。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $PATHS
          git commit -m "chore: 更新情報を書き直す（自動）"
          # ⚠️ push を素で撃たない。組み直しからここまでのあいだに人のマージが
          #    入ると非 fast-forward で落ち、**その朝の組み直しが丸ごと捨てられる**。
          #    commit はできているが push されないまま、ランナーごと消える。
          #    窓は実測で約 1 分（2026-08-30 は checkout 23:29:43Z → push 23:30:42Z）。
          #    上の concurrency（:15-17）は sync-updates 同士の重なりしか防がない。
          #
          # 落ちたら「main が進んだ」とみて、載せ直して 1 回だけやり直す。
          # ⚠️ 2 回はやらない。同じ数秒にもう一度ぶつかることは考えにくく、
          #    輪にすると忙しい main を相手に回り続ける。
          # ⚠️ ぶつかったら黙って片方を選ばない。ここに並ぶのは全部生成物だが、
          #    人が手で直した生成物（2026-08-31 の #126 がそう）もありうる。
          #    -X theirs で押し通すと、その直しが誰にも見えないまま消える。
          if ! git push; then
            echo "push が落ちた。main が進んだとみて、載せ直して 1 回だけやり直す。"
            git pull --rebase origin main || {
              git rebase --abort || true
              echo "::error::組み直したものと人の直しが同じファイルでぶつかりました。手で見てください。"
              exit 1
            }
            git push
          fi

      # ⚠️ コミットの「あと」に見る。ここで止めると、その日の紹介ページの
      #    組み直しごと落ちてしまう。赤は「やり残しの一覧」として読む
      #    （配布のとりのこし検査と同じ考え方）。
      #
      # なぜここに要るか。この流れは GITHUB_TOKEN で push するので、GitHub の
      # 仕様で standards-ci が起動しない。新しい紹介記事が入った朝は、共有の絵と
      # 画面写真の控えがまだ無いまま main に入り、**誰にも気づかれずに main が
      # 赤い状態**になる。2026-08-24 に quarto でそれが起きた。
      # 作るには Pillow が要るので、ここでは足りないことを言うだけにする。
      # ⚠️ 3 本を 1 つの run にまとめないこと。既定のシェルは `bash -e` なので、
      #    最初に落ちた 1 本でステップが終わり、**残りは 1 行も出ない**。
      #    それでは「やり残しの一覧」にならず、直す人は出ている分だけ直して
      #    終わったと読み、翌朝また別の赤を見ることになる。
      #    2026-08-31 は og ✅ → 記事 ✅ → マニュアル ❌ の順だったので 56 枚が
      #    見えたが、og が欠けていれば 56 枚は隠れたままだった。
      #
      # ⚠️ `!cancelled()` を付けるのは、上の push が競合で落ちた日にも見るため。
      #    条件を書かないと、直前のステップが赤い朝は点検ごと skip される。
      #    main の状態がいちばん分からない日に限って何も分からなくなる。
      - name: 共有の絵がそろっているか
        if: ${{ !cancelled() }}
        run: python3 tools/build-og.py --check

      - name: 紹介記事の画面写真がそろっているか
        if: ${{ !cancelled() }}
        run: python3 tools/build-article-images.py --check

      - name: 使い方マニュアルの画面写真がそろっているか
        if: ${{ !cancelled() }}
        run: python3 tools/build-article-images.py --check --kind manual

      # 落ちた朝を、人に届く形にする。次に緑で終わった朝が自分で閉じる。
      # ⚠️ 上の 3 つの点検は「やり残しの一覧」として赤くなる。一覧は、読まれなければ
      #    無いのと同じ。この流れは 35 日つづけて緑だったが、赤くなった朝に
      #    気づく道はここにも無かった（2026-11-10）。
      - name: 結果を Issue に知らせる
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ job.status }}
        run: |
          node tools/report-issue.mjs --key sync-updates \
            --title '🔴 朝の組み直し（更新情報を書き直す）が失敗しました' \
            --status "$STATUS" \
            --hint '実行の記録で、赤い手順の出力を見る。画面写真の控えなら python3 tools/build-article-images.py（--kind manual）で作り直す' \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
