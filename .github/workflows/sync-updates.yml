name: 更新情報を書き直す

# 各アプリのリポジトリを GitHub API で見に行き、公開日と最終更新日を data/apps.json に取り込んで、
# index.html の「更新情報」の節（updates:start 〜 updates:end）を組み直す。
# 変更があったときだけコミットする。

on:
  schedule:
    - cron: '17 21 * * *'      # UTC 21:17 ＝ 日本時間 朝 6:17
  workflow_dispatch:            # 手で実行することもできる

permissions:
  contents: write

concurrency:
  group: sync-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 日付を取り直して index.html を組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync-updates.mjs --fetch

      # 各アプリのリポジトリにある docs/devlog/*.md を取ってきて、
      # giga-school.com/devlog/ に組み直す。published: true のものだけ出る。
      # ⚠️ 紹介ページより先に走らせる。紹介ページの末尾に出す
      #    「このアプリのつくり方（記録 N 本）」が data/devlog.json を読むため。
      #    順を入れ替えると、公開した当日だけ本数が 1 日ぶん古くなる。
      - name: 開発記録を組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-devlog.mjs

      # 各アプリのリポジトリにある note 記事を取ってきて、
      # giga-school.com/apps/<slug>/ の紹介ページとして書き出す。
      # 日付を先に取り直しておくのは、ページに出す「最終更新」に使うため。
      - name: アプリの紹介ページを組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-articles.mjs

      # sitemap と /apps/ の一覧は data/articles.json を見て組む。
      # その articles.json をいま書き替えたので、もう一度組み直す。
      # ここは GitHub を見に行かないので、すぐ終わる。
      - name: サイトマップと紹介ページの一覧を組み直す
        run: node tools/sync-updates.mjs

      # カードの data-slug は「最近開いた順」の記録に使う。カードの「開く」の
      # 行き先と食い違うと、押したのとは別のアプリを開いたことになり、
      # その記録が端末に残り続ける。気づきにくいので、ここで止める。
      - name: カードの data-slug が食い違っていないか
        run: node tools/check-cards.mjs

      # data/apps.json は 404.html の転送先の元になっている。
      # 取り込みで slug が壊れると、旧アドレスの受け皿が黙って効かなくなるので、
      # コミットする前にここで確かめる。
      - name: 旧アドレスの受け皿が壊れていないか
        run: node tools/check-404-redirect.mjs

      # index.html は Service Worker の先読み一覧に入っている。書き替えたのに
      # 版を刻み直さないと、キャッシュ名が変わらないので、書き替えた入口が
      # 端末に届かない。しかもここは GITHUB_TOKEN で push するため、
      # GitHub の仕様でワークフローが起動せず、standards-ci の版ずれ検査を
      # 素通りする。赤くならないまま古い入口が残りつづける形になるので、
      # コミットする前にここで刻む。
      - name: SW の版を刻み直す
        run: |
          node tools/build-sw.mjs
          # 刻めたことをその場で確かめる。手順を入れ替えて刻む前にコミット
          # する形に戻ってしまったとき、ここで赤くなる。
          node tools/build-sw.mjs --check

      - name: 変わっていたらコミットする
        # ⚠️ ここに並べた道だけがコミットに入る。組み直したのに並べ忘れた
        #    ページは、毎朝つくり直されては毎朝捨てられる。リポジトリには
        #    古い数字が残り続け、しかも検査は組み直したあとの新しいページを
        #    見るので緑のままになる。**目でも検査でも気づけない**。
        #    上の各手順が書き出す先を、ひとつ残らずここに並べる。
        #      tools/sync-updates.mjs  data/apps.json / index.html / sitemap.xml /
        #                              feed.xml / apps/ / filtering/ / press/ /
        #                              data/search-index.json
        #      tools/build-devlog.mjs  data/devlog.json / devlog/
        #      tools/build-articles.mjs data/articles.json / apps/
        #      tools/build-sw.mjs      sw.js
        run: |
          PATHS="data/apps.json data/articles.json data/devlog.json data/search-index.json \
                 index.html sitemap.xml feed.xml sw.js apps/ devlog/ filtering/ press/"
          # git diff は追跡ずみのものしか見ない。新しく増えたページ（新しい
          # 紹介ページ、新しい分野の入口）は git status のほうで拾う。
          if git diff --quiet -- $PATHS && [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "変更なし。コミットしない。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $PATHS
          git commit -m "chore: 更新情報を書き直す（自動）"
          git push

      # ⚠️ コミットの「あと」に見る。ここで止めると、その日の紹介ページの
      #    組み直しごと落ちてしまう。赤は「やり残しの一覧」として読む
      #    （配布のとりのこし検査と同じ考え方）。
      #
      # なぜここに要るか。この流れは GITHUB_TOKEN で push するので、GitHub の
      # 仕様で standards-ci が起動しない。新しい紹介記事が入った朝は、共有の絵と
      # 画面写真の控えがまだ無いまま main に入り、**誰にも気づかれずに main が
      # 赤い状態**になる。2026-08-24 に quarto でそれが起きた。
      # 作るには Pillow が要るので、ここでは足りないことを言うだけにする。
      - name: 共有の絵と画面写真がそろっているか
        run: |
          python3 tools/build-og.py --check
          python3 tools/build-article-images.py --check
