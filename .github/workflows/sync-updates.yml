name: 更新情報を書き直す

# 各アプリのリポジトリを GitHub API で見に行き、公開日と最終更新日を data/apps.json に取り込んで、
# index.html の「更新情報」の節（updates:start 〜 updates:end）を組み直す。
# 変更があったときだけコミットする。

on:
  schedule:
    - cron: '17 21 * * *'      # UTC 21:17 ＝ 日本時間 朝 6:17
  workflow_dispatch:            # 手で実行することもできる

permissions:
  contents: write

concurrency:
  group: sync-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 日付を取り直して index.html を組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sync-updates.mjs --fetch

      # 各アプリのリポジトリにある note 記事を取ってきて、
      # giga-school.com/apps/<slug>/ の紹介ページとして書き出す。
      # 日付を先に取り直しておくのは、ページに出す「最終更新」に使うため。
      - name: アプリの紹介ページを組み直す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-articles.mjs

      # sitemap と /apps/ の一覧は data/articles.json を見て組む。
      # その articles.json をいま書き替えたので、もう一度組み直す。
      # ここは GitHub を見に行かないので、すぐ終わる。
      - name: サイトマップと紹介ページの一覧を組み直す
        run: node tools/sync-updates.mjs

      # 「こんなときに」のタイルと、カードの data-scenes / data-slug は
      # どちらも index.html に手で書いてある。片方だけ直すと、押しても
      # 0 件のタイルが残る。押して何も出ないのがいちばん困るので、ここで止める。
      - name: 「こんなときに」の割り当てが食い違っていないか
        run: node tools/check-scenes.mjs

      # data/apps.json は 404.html の転送先の元になっている。
      # 取り込みで slug が壊れると、旧アドレスの受け皿が黙って効かなくなるので、
      # コミットする前にここで確かめる。
      - name: 旧アドレスの受け皿が壊れていないか
        run: node tools/check-404-redirect.mjs

      - name: 変わっていたらコミットする
        run: |
          if git diff --quiet -- data/apps.json data/articles.json index.html sitemap.xml apps/ \
             && [ -z "$(git status --porcelain -- apps/)" ]; then
            echo "変更なし。コミットしない。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apps.json data/articles.json index.html sitemap.xml apps/
          git commit -m "chore: 更新情報を書き直す（自動）"
          git push
