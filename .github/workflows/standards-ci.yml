# standards/（正本）自身の検査。
# 正本が壊れると、ドリフト検知を通じて全リポジトリへ壊れたまま配られるため、
# 各リポジトリのゲートより先に、ここで正本そのものを検査する。
name: standards-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 正本の品質ゲート自身のテスト
        run: node --test standards/lib/*.test.mjs
      - name: 正本の GAS モジュールのテスト
        run: node --test standards/gas/*.test.mjs
      - name: ドリフト検知そのもののテスト
        run: node --test standards/check-drift.test.mjs
      # エージェントの hook。終了コードでしか意思を伝えられないので、
      # 試験は CLI を実際に起動して 2（止める）／0（通す）を見ている。
      # ⚠️ fail-open を崩さないこと。壊れた hook が 42 本の編集を止めるほうが、
      #    防ごうとしている事故よりはるかに重い。
      - name: エージェントの hook のテスト
        run: node --test standards/agents/hooks/*.test.mjs
      # ⚠️ 上はドリフト検知「の」テストであって、ポータル自身を見てはいない。
      #    そのせいで tools/build-sw.mjs が正本から離れたまま 2026-08-28 まで
      #    誰にも気づかれずに残った（正本だけ直して写しを配り忘れた形）。
      #    配る側が自分の写しを照合していないのでは、配布先に何も言えない。
      - name: ポータル自身が正本とずれていないか
        run: node standards/check-drift.mjs --standards standards
      - name: SW の版づけのテスト（実際に走らせて確かめる）
        run: node --test standards/sw/*.test.mjs
      # ポータル自身も同じ標準に従う。版を刻み忘れたままコミットすると、
      # 全アプリの入口が古いシェルのまま残る
      - name: ポータル自身の SW の版がずれていないか
        run: node tools/build-sw.mjs --check
      - name: 正本のブラウザ側モジュールのテスト
        run: node --test standards/web/*.test.mjs
      # フォントの取り寄せ。text= は約800字で「エラーにならずに」効かなくなる。
      # そこを見のがすと、狭い範囲だけの 1KB のフォントが書き出され、画面のほとんどが
      # 端末フォントに落ちたまま「ビルド成功」になる（2026-08-28 実測）
      - name: 自己ホストするフォントの取り寄せのテスト
        run: node --test standards/fonts/*.test.mjs
      # ライブラリの取りこみ。走査の取りこぼしは「その画面だけアイコンが消える」
      # という形で出て、ビルドも静的解析も通ってしまう（MIRAI-Compass で実際に起きた）。
      - name: 自己ホストするライブラリの取りこみのテスト
        run: node --test standards/vendor/*.test.mjs
      # 学習ログを「誰に渡してよいか」を決めている場所。配布先では走っていたが、
      # 正本そのものでは一度も走っていなかった（置き場を js/ 決め打ちにしていたため）。
      - name: 学習ログの受け渡し口のテスト
        run: node --test standards/records/records-export.test.mjs
      # ポータル自身も同じ標準に従う。正本を配る側が漏らしていては話にならない。
      - name: ポータルに秘密の直書きが無いか
        run: node standards/lib/check-secrets.mjs
      # 配る前にここで読めることを確かめる。壊れた YAML を配ると、
      # 配布先では「ワークフローが登録されない」形で静かに失敗する。
      # 配布のとりのこし検査は台帳（tools/distribution.json）を読む。
      # 台帳が壊れると「配る先が0本」でも緑になりうるので、ここで見ておく。
      - name: 配布の台帳と突き合わせの仕組みのテスト
        run: node --test tools/check-distribution.test.mjs
      # 実ブラウザ巡回の「突き合わせの計算」。巡回そのものは playwright が要るので
      # verify-runtime.yml が週次で行う。ここが緑でも「本番を見た」ことにはならない。
      - name: 実測ホストの突き合わせのテスト
        run: node --test tools/verify-runtime.test.mjs
      # 艦隊の状態を数える道具。「測れなかった」を「きれい」と数えないことを
      # 試験で固定してある。ここが崩れると、見ていないのに緑を出す道具になる。
      - name: 艦隊の状態を数える仕組みのテスト
        run: node --test tools/fleet-status.test.mjs
      # 手書きの JSON-RPC なので、プロトコルの形そのものを試験で見る。
      # SDK を入れていないぶん（ポータルに package.json を持たない方針）、
      # ここが唯一の受け止めになる。
      - name: 艦隊 MCP サーバのテスト
        run: node --test tools/mcp/*.test.mjs
      # 教訓が検査に落ちているかを見る。②「書いた検査が実在しない」が本体で、
      # これは 2026-08-28 の giga-reviewer（検査項目に書いてあるのに実装が無い）
      # と同じ型。台帳が嘘をつくと、台帳があるぶんだけ事故が見えにくくなる。
      - name: 教訓が検査に落ちているか
        run: |
          node --test tools/check-lessons.test.mjs
          node tools/check-lessons.mjs
      # ふりがなの落とし方。目次・索引・説明文の 3 か所が同じ関数を通るので、
      # 効かなくなると 3 か所で同時に「学がく年ねん」が出る
      - name: ふりがなを落とすところのテスト
        run: node --test tools/lib/plain-text.test.mjs
      # 目次が壊れると、朝の組み直しで 31 本の紹介ページが一斉に同じ形で崩れる
      - name: 紹介ページの目次と読了時間のテスト
        run: node --test tools/lib/article-toc.test.mjs
      # 紹介ページの骨組みと説明文。ここが CI に無いまま長く来ていた
      - name: 紹介ページの組み立てのテスト
        run: node --test tools/lib/article-page.test.mjs
      # 画像の読む先。ここが崩れると、絵の入る場所だけが黙って空く
      - name: 画面写真の読む先のテスト
        run: node --test tools/lib/article-images.test.mjs
      # 分類と対象学年の書きかた。ここも 31 本に一斉に出る
      - name: 分類の表のテスト
        run: node --test tools/lib/categories.test.mjs
      # 分野ごとの入口。検索から直接来る人の着地点になる
      - name: 分野ごとの入口ページのテスト
        run: node --test tools/lib/category-page.test.mjs
      # 索引が静かに空になっても、画面には「見つかりません」と出るだけで気づけない
      # 配布先ごとに埋める字。埋める役が居なかったせいで、9 本中 8 本が
      # 「このページは、__APP_NAME__の学習記録を…」と公開されていた。
      # check-drift は両側をプレースホルダーへそろえて比べるので緑のままだった。
      - name: 配布先ごとに埋める字のテスト
        run: node --test tools/lib/app-placeholders.test.mjs
      # 記事・開発記録・マニュアルの 3 つが通る唯一の道。壊すと 3 つ同時に、
      # しかも「ページは出るが中身が違う」形で崩れる
      - name: Markdown を HTML にするところのテスト
        run: node --test tools/lib/article-md.test.mjs
      - name: 記事の中を探す索引のテスト
        run: node --test tools/lib/search-index.test.mjs
      # 更新の記録。書いていないアプリに何かが出ると、31 本ぶんを目で確かめることになる
      - name: 更新の記録のテスト
        run: node --test tools/lib/changelog.test.mjs
      # 記事を伝えるための入口。符号化を落とすと、題に & や # を含む記事だけ
      # 投稿画面に途中までしか渡らず、しかも画面上は普通に見える
      - name: 記事を伝える入口のテスト
        run: node --test tools/lib/article-share.test.mjs
      # 使い方マニュアルのページ。紹介ページと骨組みを共有しているので、
      # ここが崩れると両方に一斉に出る
      - name: 使い方マニュアルのページのテスト
        run: node --test tools/lib/manual-page.test.mjs
      # GitHub の取り口。記事・開発記録・マニュアルの 3 つが同じ道を通るので、
      # 壊れると 3 つ同時に、しかも「置いていないアプリ」と区別のつかない形で落ちる
      - name: GitHub の取り口のテスト
        run: node --test tools/lib/gh.test.mjs
      # 公開ページの日付。ここが崩れると lastmod が毎朝いっせいに「今日」へ動き、
      # Google は lastmod をまるごと無視するようになる（2026-08-30 に 90 URL 中 88 が
      # 同じ日付だった）。しかも**直したはず**のあとに崩れるので、誰も見に行かない
      - name: 日付を日本時間で切るところのテスト
        run: node --test tools/lib/dates.test.mjs
      - name: 日付の台帳のテスト
        run: node --test tools/lib/lastmod.test.mjs
      - name: サイトマップの組み立てのテスト
        run: node --test tools/lib/sitemap.test.mjs
      - name: Atom フィードの組み立てのテスト
        run: node --test tools/lib/feed.test.mjs
      # 数字の表記（A10）。書き手が読む検査なので、嘘の警告が出ると本物が読み飛ばされる。
      # note 版と開発記録版で助数詞と除外がそろっていることも、ここで見る
      - name: 数量の表記の検査のテスト
        run: node --test standards/skills/note-article/scripts/lint-article.test.mjs
      # 共有されたときの絵。足りないと、そのアプリだけ中身と関係ない絵で貼られる。
      # 見るだけなので Pillow は要らない
      - name: 共有の絵がそろっているか
        run: python3 tools/build-og.py --check
      # 記事の画面写真。自分のドメインに控えが無いと、GitHub を塞いでいる学校で
      # 11 本の記事の画像が 21 枚まとめて出なくなる。見るだけなので Pillow は要らない
      - name: 記事の画面写真がそろっているか
        run: python3 tools/build-article-images.py --check
      - name: GIGA標準検査のテスト
        run: node --test standards/skills/giga-reviewer/scripts/*.test.mjs
      # マニュアルの書式。見出しの並びから目次と検索の索引が作られるので、
      # 外しても手元では何も起きず、気づくのは翌朝ページが崩れてからになる
      - name: 使い方マニュアルの書式の検査のテスト
        run: node --test standards/skills/giga-manual/scripts/*.test.mjs
      # 書き出し先の台帳。PATHS に並べ忘れた道は、毎朝つくられては毎朝捨てられ、
      # しかも検査は組み直したあとを見るので緑のまま通る
      - name: 書き出し先が PATHS に並んでいるか
        run: |
          node --test tools/check-outputs.test.mjs
          node tools/check-outputs.mjs
      - name: 正本のワークフローが YAML として読めるか
        run: python3 -c "import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" standards/gas/deploy.yml
      - name: 正本の構文検査
        run: |
          for f in standards/lib/*.mjs standards/sw/*.mjs standards/gas/*.mjs standards/fonts/*.mjs standards/vendor/*.mjs standards/check-drift.mjs standards/records/records-export.js standards/records/records-hub-client.js standards/web/giga-gas-client.js standards/web/giga-app-links.js standards/skills/*/scripts/*.mjs; do
            node --check "$f"
          done
          # .gs は Node が拡張子を知らないので、写してから見る
          for f in standards/gas/*.gs; do
            cp "$f" "/tmp/$(basename "$f").js" && node --check "/tmp/$(basename "$f").js"
          done
